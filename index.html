<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Creative Optics Operations</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Creative Ops">
<meta name="theme-color" content="#0F4C49">
<style>
  html,body{margin:0;height:100%;background:#fff}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0}
  #m{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-family:sans-serif;color:#0F4C49}
</style>
</head>
<body>
<div id="m">...</div>
<script>
// "frame" = يفتح التطبيق داخل الصفحة (تبقى الأيقونة والعنوان بتوعك)
// "redirect" = يحوّل مباشرة لرابط التطبيق (لو حصلت مشكلة في وضع frame)
var MODE = "frame";
var APP_URL = "https://script.google.com/macros/s/AKfycbwk2oiasGIxwmX84LvE9ht1mWBPYzIbD5mgeMnwTRKh9sRYbwyHfXkvl3fAX3i-OAJE/exec";
if (MODE === "redirect") { location.replace(APP_URL); }
else {
  var f = document.createElement("iframe");
  f.src = APP_URL;
  f.allow = "camera; microphone; clipboard-write";
  document.body.appendChild(f);
  document.getElementById("m").remove();
}
</script>
</body>
</html>
